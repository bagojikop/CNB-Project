<c-modal
  id="liveDemoModal"
  alignment="center"
  [visible]="isShow"
  style="--cui-modal-width: 420px"
>
  <c-modal-header
    style="
      border-bottom: 2px solid #e8edf2;
      background: #f8fafc;
      padding: 1.25rem 1.5rem;
      border-radius: 12px 12px 0 0;
    "
  >
    <h5
      cModalTitle
      style="
        color: #1a2332;
        font-weight: 700;
        font-size: 1.15rem;
        letter-spacing: -0.01em;
        margin: 0;
      "
    >
      Verify OTP
    </h5>

    <button
      cButtonClose
      (click)="modalClose()"
      style="opacity: 0.6; padding: 0.5rem"
    ></button>
  </c-modal-header>

  <c-modal-body style="padding: 2rem 1.75rem; background: #ffffff">
  </c-modal-body>

  <c-modal-footer
    style="
      border-top: 1px solid #e8edf2;
      background: #f8fafc;
      padding: 1rem 1.75rem;
      border-radius: 0 0 12px 12px;
      gap: 0.75rem;
    "
  >
    <button
      cButton
      color="secondary"
      (click)="modalClose()"
      style="
        border-radius: 8px;
        padding: 0.55rem 1.5rem;
        font-weight: 500;
        font-size: 0.9rem;
        background: #f1f3f5;
        border: 1px solid #d0d7e2;
        color: #4a5a6e;
        transition: background 0.2s;
      "
    >
      Close
    </button>

    <button
      cButton
      color="primary"
      (click)="save()"
      style="
        border-radius: 8px;
        padding: 0.55rem 1.75rem;
        font-weight: 600;
        font-size: 0.9rem;
        background: #3b82f6;
        border: none;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        transition: box-shadow 0.2s;
      "
    >
      Save
    </button>
  </c-modal-footer>
</c-modal>
