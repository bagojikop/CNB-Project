<div class="container">
  <form [formGroup]="configInputs" class="card dss-card-vh-100">
    <div
      class="card-header d-flex mb-3 justify-content-between align-items-center p-3"
      style="background-color: #00d3ff !important"
    >
      <div class="d-flex gap-3 align-items-center">
        <svg cIcon name="cilBank" size="lg"></svg>
        <h3 class="mb-0">Bank Credentials</h3>
      </div>
      <button (click)="closePage()" cButtonClose></button>
    </div>

    <div class="card-body">
      <div
        class="card-header mb-3 d-flex gap-3 fw-bold gradient-border align-items-center"
      >
        <svg cIcon name="cilBuilding" size="sm"></svg>
        <h5 class="mb-0 text-secondary">Firm Details</h5>
      </div>

      <c-row class="mb-3 mx-1">
        <c-col sm="3">
          <dss-input-text
            label="FIRM ID"
            icon="cilBuilding"
            sizing="md"
            formControlName="firmId"
          ></dss-input-text>
        </c-col>
        <c-col sm="3">
          <dss-input-text
            label="BRANCH ID"
            icon="cilFork"
            sizing="md"
            formControlName="branchId"
          ></dss-input-text>
        </c-col>
        <c-col sm="6">
          <dss-input-text
            label="FIRM NAME"
            sizing="md"
            formControlName="firmName"
            [caseStyle]="caseStyle.UPPERCASE"
          ></dss-input-text>
        </c-col>
      </c-row>

      <!-- Details-->
      <div
        class="card-header mb-3 d-flex gap-3 fw-bold gradient-border align-items-center"
      >
        <svg cIcon name="cilNotes" size="sm"></svg>
        <h5 class="mb-0 text-secondary">Canara Bank Details</h5>
      </div>

      <c-row class="mb-3 mx-1">
        <c-col sm="6" md="6" lg="2">
          <dss-input-text
            label="ACCOUNT NO"
            icon="cilCreditCard"
            sizing="md"
            formControlName="accountNo"
          ></dss-input-text>
        </c-col>

        <c-col sm="6" md="6" lg="2">
          <dss-input-text
            label=" IFSC CODE   (optional)"
            icon="cilUser"
            sizing="md"
            formControlName="IFSC_Code"
          ></dss-input-text>
        </c-col>

        <c-col sm="6" md="6" lg="2">
          <dss-input-text
            label="CUSTOMER ID"
            icon="cilUserFollow"
            sizing="md"
            formControlName="customerId"
          ></dss-input-text>
        </c-col>

        <c-col sm="6" md="6" lg="6">
          <dss-input-text
            label="ACCOUNT NAME"
            icon="cilUser"
            sizing="md"
            [caseStyle]="caseStyle.UPPERCASE"
            formControlName="accountName"
          ></dss-input-text>
        </c-col>
      </c-row>

      <div
        class="card-header mb-3 d-flex gap-3 fw-bold gradient-border align-items-center"
      >
        <svg cIcon name="cilLockLocked" size="sm"></svg>
        <h5 class="mb-0 text-secondary">API & Integration Keys</h5>
      </div>
      <c-row class="mb-3 mx-1">
        <c-col sm="5">
          <dss-input-text
            label="CLIENT ID"
            icon="cilUserFollow"
            sizing="md"
            formControlName="clientId"
          ></dss-input-text>
        </c-col>

        <c-col sm="7">
          <dss-input-text
            label="CLIENT SECRET KEY"
            icon="cilLockLocked"
            sizing="md"
            formControlName="clientSecretKey"
          ></dss-input-text>
        </c-col>
      </c-row>
      <c-row class="mb-3 mx-1">
        <c-col sm="5">
          <dss-input-text
            label="SYMMETRIC KEY"
            icon="cilLockLocked"
            sizing="md"
            formControlName="symmetric_key"
          ></dss-input-text>
        </c-col>

        <c-col sm="4">
          <dss-input-text
            label="WEBHOOK ADDRESS"
            sizing="md"
            icon="cilLink"
            formControlName="webhook_address"
          ></dss-input-text>
        </c-col>
        <c-col sm="3">
          <dss-input-text
            label="STATIC IP"
            sizing="md"
            icon="cilLink"
            formControlName="static_ip"
          ></dss-input-text>
        </c-col>
      </c-row>
    </div>
    <div class="card-footer">
      <c-row class="justify-content-start justify-content-md-end g-2">
        <c-col xs="12" sm="12" md="6" lg="2">
          <button
            cButton
            color="success"
            class="w-100"
            [disabled]="configInputs.invalid || isConfSubmitting"
            (click)="save()"
          >
            SUBMIT
          </button>
        </c-col>

        <c-col xs="12" sm="12" md="6" lg="3">
          <button
            cButton
            color="secondary"
            class="w-100 text-light"
            (click)="visible = true"
            [disabled]="isTxnPsw || this.configInputs.invalid"
          >
            TXN PASSWORD
          </button>
        </c-col>
      </c-row>
    </div>
  </form>
</div>

<c-modal id="liveDemoModal" alignment="center" [(visible)]="visible">
  <c-modal-header>
    <h5 cModalTitle>TXN PASSWORD</h5>
    <button (click)="toggleLiveDemo()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <form [formGroup]="modalForm">
      <c-row>
        <c-col sm="9">
          <dss-input-text
            type="password"
            label="TXN PASSWORD"
            placeholder="Enter TXN Password"
            icon="cilLockLocked"
            formControlName="txn_password"
          ></dss-input-text>
        </c-col>
        <c-col sm="2" class="d-flex align-items-center">
          <button
            cButton
            color="success"
            size="sm"
            class="mt-2"
            (click)="sendEncryptedPsw()"
            [disabled]="isTXNPassword()"
          >
            EXECUTE
          </button>
        </c-col>
      </c-row>

      <p class="bg-warning p-1 rounded">
        Please enter the transaction password registered with Your Bank.
      </p>

      @if (showOtp) {
        <c-row>
          <c-col sm="7">
            <dss-input-text
              autocomplete=""
              label="MOBILE NO"
              disabled="true"
              formControlName="mobile_no"
            ></dss-input-text>
          </c-col>
          <c-col sm="5">
            <dss-input-text
              label="ENTER OTP"
              formControlName="mobile_otp"
            ></dss-input-text
          ></c-col>
        </c-row>
      }
    </form>
  </c-modal-body>
  <c-modal-footer>
    <button (click)="toggleLiveDemo()" cButton color="secondary">CLOSE</button>
    <button
      cButton
      color="primary"
      [disabled]="modalForm.invalid"
      (click)="saveModalData()"
    >
      SUBMIT
    </button>
  </c-modal-footer>
</c-modal>
